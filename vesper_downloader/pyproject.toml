[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-downloader"
version = "0.1.0"
description = "CLI for collecting Jenkins ZIP artifacts and writing a local manifest"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
	"vesper-core>=0.1.0",
]

[project.scripts]
vesper-downloader = "vesper_downloader.main:main"

[project.optional-dependencies]
release = [
	"build>=1.2",
	"twine>=5.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["vesper_downloader", "vesper_downloader.*"]

[tool.setuptools.package-data]
vesper_downloader = [
	"config.template.json",
	"manifest.example.json",
	"manifest.job-url-list.example.json",
]
