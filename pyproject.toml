[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-core"
version = "0.1.0"
description = "Shared manifest contract and neutral utilities for vesper applications"
readme = "vesper_core/README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
release = [
	"build>=1.2",
	"twine>=5.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["vesper_core", "vesper_core.*"]
